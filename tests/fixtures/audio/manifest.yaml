# Golden recordings for tests/evals/test_stt_samples.py (Phase 4, BUILD_PLAN
# task "record 10 short .wav files of yourself and friends saying Hinglish
# booking sentences").
#
# How to record:
#   1. Read each `text` line aloud naturally (Hinglish, not over-enunciated).
#   2. Save as a mono WAV, any common sample rate (16kHz+), under the matching
#      `file` name directly in this tests/fixtures/audio/ directory.
#   3. Run: pytest -m live tests/evals/test_stt_samples.py
#   4. Missing files are reported, not failed — add them incrementally and
#      re-run; the test only asserts the 8/10 pass rate once all 10 exist.
#
# `entities`: each value is a list of acceptable alternates (STT sometimes
# transcribes a number as a digit, sometimes as the spoken word, and may mix
# Devanagari/Latin script) — any one alternate appearing in the transcript
# satisfies that entity.

- file: sample_01.wav
  text: "Kal shaam saade paanch baje cleaning ka slot chahiye."
  entities:
    day: ["kal", "कल"]
    time: ["paanch", "5", "पाँच", "पांच"]
    service: ["cleaning", "क्लीनिंग"]

- file: sample_02.wav
  text: "Parso subah das baje consultation book kar do."
  entities:
    day: ["parso", "परसों"]
    time: ["das", "10", "दस"]
    service: ["consultation", "कंसल्टेशन"]

- file: sample_03.wav
  text: "Aaj dopahar teen baje filling ka time hai kya?"
  entities:
    day: ["aaj", "आज"]
    time: ["teen", "3", "तीन"]
    service: ["filling", "फिलिंग"]

- file: sample_04.wav
  text: "Mujhe Monday ko root canal ke liye appointment chahiye, subah gyarah baje."
  entities:
    # Sarvam transliterates the spoken English day/service name phonetically
    # into Devanagari ("मंडे", "रूट कैनाल") rather than using the native
    # Hindi word ("सोमवार") - found via the actual transcript, not guessed.
    day: ["monday", "सोमवार", "मंडे"]
    time: ["gyarah", "11", "ग्यारह"]
    service: ["root canal", "root", "रूट"]

