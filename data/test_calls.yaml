      - tool: answer_faq
        args: { question: "doctor qualifications" }
    max_sentences: 2
    notes: "must_mention dropped entirely per Phase 5's 5.10 eval-debt pass (was [\"BDS\"], then [\"dentist\"]): the model's exact wording varies run to run (sometimes \"qualified dentist\", sometimes a phrasing that drops that literal word), and the FAQ answer says \"BDS/MDS qualified dentist\" so any faithful paraphrase is correct - must_not_hallucinate already guarantees the reply isn't inventing a qualification."
    must_not_hallucinate: true

