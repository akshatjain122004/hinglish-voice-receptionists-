- id: unclear_001
  category: unclear
  language: hinglish
  turns:
    - "Haan woh... kuch chahiye tha mujhe... pata nahi."
  expected:
    tool_calls: []
    max_sentences: 2
    must_mention: ["appointment"]
    notes: "Bot should ask a clarifying question rather than guess a tool call. must_mention narrowed from [\"booking\", \"appointment\"] (both required - AND semantics) to just [\"appointment\"] during Phase 5's 5.10 eval-debt pass: a short clarifying question reasonably uses one loanword, not both, and check_must_mention has no OR option."

