- id: faq_005
  category: faq
  language: hinglish
  turns:
    - "Bachon ka treatment karte ho aap?"
  expected:
    tool_calls:
      - tool: answer_faq
        args: {}
    max_sentences: 2
    must_not_hallucinate: true
    notes: "args no longer checks `question` - dropped per Phase 5's 5.10 eval-debt pass: the model correctly paraphrases the caller's question into a full English sentence for the RAG query (e.g. \"Do you provide dental treatment for children?\"), which shares almost no literal words with a short topic phrase like \"pediatric dental care\" even under the word-form/threshold matching. The query's exact wording isn't caller-visible and doesn't affect correctness - must_not_hallucinate already covers that."

