        args: { service: whitening }
      - tool: book_appointment
        args: { service: whitening }
    max_sentences: 2
    must_not_hallucinate: true
    notes: "The caller never says 'subah' until turn 2, after the first check_slots call - part_of_day: morning was removed from that call's expectation since it's chronologically impossible for the agent to have known it yet (root-caused during Phase 3, fixed during Phase 5's 5.10 eval-debt pass)."

