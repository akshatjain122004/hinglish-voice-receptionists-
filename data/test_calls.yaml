# Golden Hinglish test conversations for the eval suite (Phase 2+).
# Placeholder cases for development against the placeholder clinic in
# clinic.yaml / faqs.md. Add real pilot cases during Phase 10 (see
# docs/BUILD_PLAN.md "Don't change test_calls.yaml expectations just to
# make a failing eval pass" rule in CLAUDE.md).
#
# Schema:
#   id: unique string
#   category: booking | no_slot | faq | reschedule | cancel |
#             language_switch | code_switch | unclear | off_topic | human_handoff
#             (code_switch: English and Hindi/Hinglish mixed *within* one
#             utterance, e.g. "tomorrow evening ka appointment chahiye" -
#             distinct from language_switch, where the caller changes
#             language *between* turns)
#   language: hinglish | hindi | english
#   turns: ordered list of caller utterances (one session)
#   expected:
#     tool_calls: ordered list of {tool, args} the agent should call
#                 (args are the minimum fields that must match; omit a
#                 field the eval shouldn't check)
#     max_sentences: max sentences per bot reply
#     must_mention: phrases/values that must appear in the final reply
#       if the booking succeeds (e.g. the confirmed time)
#     must_not_hallucinate: true means every time/price/slot spoken must
#       come from a tool result, never invented

- id: booking_001
  category: booking
  language: hinglish
  turns:
    - "Hello, kal shaam ko cleaning ka slot milega?"
    - "Saade paanch theek hai."
    - "Ravi"
    - "Haan, confirm kar do."
  expected:
    tool_calls:
      - tool: check_slots
        args: { service: cleaning, part_of_day: evening }
      - tool: book_appointment
        args: { service: cleaning }
    max_sentences: 2
    must_not_hallucinate: true

