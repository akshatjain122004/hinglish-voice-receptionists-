- id: booking_005
  category: booking
  language: hinglish
  turns:
    - "Teeth whitening ke liye kal ka time mil sakta hai?"
    - "Subah 11 baje theek rahega."
    - "Naam Neha, confirm kar do please."
    - "Haan, theek hai."
  expected:
    tool_calls:
